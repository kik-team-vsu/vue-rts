    <rect x="8" y="177" width="84" height="21" fill="#92400e"/>
    <rect x="8" y="202" width="84" height="21" fill="#a16207"/>
    <rect x="8" y="227" width="84" height="21" fill="#92400e"/>
    <rect x="8" y="252" width="84" height="21" fill="#a16207"/>
