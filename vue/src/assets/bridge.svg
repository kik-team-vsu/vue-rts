    <rect x="77" y="8" width="21" height="84" fill="#92400e"/>
    <rect x="102" y="8" width="21" height="84" fill="#a16207"/>
    <rect x="127" y="8" width="21" height="84" fill="#92400e"/>
    <rect x="152" y="8" width="21" height="84" fill="#a16207"/>
    <rect x="177" y="8" width="21" height="84" fill="#92400e"/>
    <rect x="202" y="8" width="21" height="84" fill="#a16207"/>
    <rect x="227" y="8" width="21" height="84" fill="#92400e"/>
    <rect x="252" y="8" width="21" height="84" fill="#a16207"/>
    <rect x="277" y="8" width="21" height="84" fill="#92400e"/>
    <rect x="302" y="8" width="21" height="84" fill="#a16207"/>
    <rect x="327" y="8" width="21" height="84" fill="#92400e"/>
