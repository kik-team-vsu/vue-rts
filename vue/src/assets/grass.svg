<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- крупные тёмные пятна: «неровности» земли -->
  <filter id="patches" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.28  0 0 0 0 0.05  0 0 0 1.1 -0.38"/>
  </filter>
  <!-- светлые пятна -->
  <filter id="light" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.80  0 0 0 0 0.30  0 0 0 1.0 -0.44"/>
  </filter>
  <!-- мелкое зерно: «травинки» -->
  <filter id="grain" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.12  0 0 0 0 0.02  0 0 0 1.0 -0.36"/>
  </filter>
  <rect width="256" height="256" filter="url(#patches)"/>
  <rect width="256" height="256" filter="url(#light)"/>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
