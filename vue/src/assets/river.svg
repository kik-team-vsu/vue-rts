<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- вытянутые по течению тёмные полосы: глубина и быстрый поток -->
  <filter id="current" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.03  0 0 0 0 0.16  0 0 0 0 0.45  0 0 0 1.1 -0.40"/>
  </filter>
  <!-- светлые полосы: блики и рябь, вытянутые вдоль течения -->
  <filter id="streaks" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.18" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.78  0 0 0 0 0.95  0 0 0 1.0 -0.46"/>
  </filter>
  <!-- мелкое зерно: «искры» на воде -->
  <filter id="grain" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.22  0 0 0 0 0.55  0 0 0 1.0 -0.38"/>
  </filter>
  <rect width="256" height="256" filter="url(#current)"/>
  <rect width="256" height="256" filter="url(#streaks)"/>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
