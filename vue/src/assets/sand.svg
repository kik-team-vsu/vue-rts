<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- дюны: крупные тёмные пятна, чуть вытянутые по ветру -->
  <filter id="dunes" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="3" seed="13" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.40  0 0 0 0 0.24  0 0 0 1.1 -0.40"/>
  </filter>
  <!-- светлые пятна: сухой песок на гребнях -->
  <filter id="crests" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="17" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.82  0 0 0 0 0.58  0 0 0 1.0 -0.46"/>
  </filter>
  <!-- мелкое зерно: песчинки -->
  <filter id="grain" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="19" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.60  0 0 0 0 0.36  0 0 0 1.0 -0.38"/>
  </filter>
  <rect width="256" height="256" filter="url(#dunes)"/>
  <rect width="256" height="256" filter="url(#crests)"/>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
